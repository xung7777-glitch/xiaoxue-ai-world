<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>英文心法 · Spellbook DLC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #070d18; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); } 50% { box-shadow: 0 0 25px rgba(6, 182, 212, 0.8); } }
    .glow-box { animation: pulseGlow 3s infinite ease-in-out; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 selection:bg-cyan-500 selection:text-white">

  <!-- Top Navigation Bar -->
  <header class="flex items-center justify-between pb-3 border-b border-cyan-900/50">
    <div class="flex items-center gap-2">
      <span class="text-xl">📖</span>
      <div>
        <h1 class="text-base font-bold text-cyan-200">西域英文心法 · 獨立 DLC</h1>
        <p class="text-[11px] text-cyan-400">/dlcs/dlc_spellbook/index.html</p>
      </div>
    </div>
    <button id="closeBtn" class="px-3 py-1 rounded-full bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700">
      ✕ 返回洞府
    </button>
  </header>

  <!-- Word Challenge Card -->
  <main class="my-auto py-6 flex flex-col items-center">
    <div class="w-full max-w-sm bg-gradient-to-b from-[#0f172a] to-[#09101d] border border-cyan-500/50 rounded-3xl p-6 text-center space-y-4 glow-box">
      
      <div class="flex items-center justify-between text-xs text-slate-400">
        <span id="levelBadge" class="px-2.5 py-0.5 rounded-full bg-cyan-950 border border-cyan-700 text-cyan-300 font-mono">第 1 / 4 式</span>
        <span class="text-emerald-400 font-medium">✨ 通關獎勵: +40 靈氣</span>
      </div>

      <div class="space-y-1">
        <h2 id="spellTitle" class="text-xl font-bold text-amber-300">【太初聚靈訣】</h2>
        <p id="spellMeaning" class="text-xs text-slate-300">奧義解讀：靈魂、神識、精靈 (/ˈspɪrɪt/)</p>
      </div>

      <!-- Letter slots -->
      <div id="wordDisplay" class="flex justify-center gap-2 py-4 text-2xl font-black font-mono">
        <!-- Rendered by JS -->
      </div>

      <p id="hintText" class="text-xs text-slate-400 italic bg-black/30 p-2.5 rounded-xl border border-slate-800">
        💡 提示：天地修煉之根本，感應大自然純淨之氣
      </p>

      <div id="successBanner" class="hidden p-3 bg-emerald-950/80 border border-emerald-500/60 rounded-xl text-xs text-emerald-300 font-bold animate-bounce">
        🎉 真言凝練功成！已向母系統派發靈氣 +40，靈石 +20！
      </div>

      <button id="nextBtn" class="hidden w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm">
        研習下一式真言 →
      </button>
    </div>

    <!-- Letter Keyboard -->
    <div id="keypad" class="w-full max-w-sm mt-5 grid grid-cols-7 gap-1.5 p-2 bg-[#09111e] rounded-2xl border border-cyan-950">
      <!-- Generated by JS -->
    </div>
  </main>

  <!-- Footer status -->
  <footer class="text-center text-[11px] text-slate-500 py-2 border-t border-slate-900">
    母系統通訊狀態：<span class="text-emerald-400 font-medium">PostMessage 雙向通道已就緒</span>
  </footer>

  <script>
    // -------------------------------------------------------------
    // DLC 獨立邏輯區 (可隨時替換為您從 GitHub 下載的任何英文專案)
    // -------------------------------------------------------------
    const SPELLS = [
      { word: "SPIRIT", missing: [2, 4], title: "太初聚靈訣", meaning: "靈魂、神識、精靈 (/ˈspɪrɪt/)", hint: "修煉根本，感應天地純淨之氣", exp: 40, stones: 20 },
      { word: "SHIELD", missing: [1, 3], title: "玄光金鐘罡氣", meaning: "護盾、庇護 (/ʃiːld/)", hint: "抵擋妖獸強烈衝擊之法陣", exp: 45, stones: 25 },
      { word: "FLAME", missing: [2, 4], title: "三昧純陽天火", meaning: "火焰、烈焰 (/fleɪm/)", hint: "煉丹與焚魔所驅使之神焰", exp: 35, stones: 15 },
      { word: "WISDOM", missing: [1, 4], title: "太通開悟神識", meaning: "智慧、悟性 (/ˈwɪzdəm/)", hint: "破除心魔，參悟大道天機", exp: 50, stones: 30 }
    ];

    let currentIdx = 0;
    let inputs = {};

    function renderSpell() {
      const spell = SPELLS[currentIdx];
      inputs = {};
      document.getElementById('spellTitle').innerText = `【${spell.title}】`;
      document.getElementById('spellMeaning').innerText = `奧義解讀：${spell.meaning}`;
      document.getElementById('hintText').innerText = `💡 提示：${spell.hint}`;
      document.getElementById('levelBadge').innerText = `第 ${currentIdx + 1} / ${SPELLS.length} 式`;
      document.getElementById('successBanner').classList.add('hidden');
      document.getElementById('nextBtn').classList.add('hidden');

      const container = document.getElementById('wordDisplay');
      container.innerHTML = '';
      spell.word.split('').forEach((char, idx) => {
        const isMissing = spell.missing.includes(idx);
        const box = document.createElement('div');
        box.className = `w-10 h-12 rounded-xl flex items-center justify-center font-bold border-2 transition-all ${
          isMissing ? 'bg-cyan-950/60 border-dashed border-cyan-400 text-cyan-200' : 'bg-slate-800 border-slate-700 text-white'
        }`;
        box.id = `slot-${idx}`;
        box.innerText = isMissing ? '?' : char;
        container.appendChild(box);
      });
    }

    function checkAnswer() {
      const spell = SPELLS[currentIdx];
      const isComplete = spell.missing.every(idx => (inputs[idx] || '').toUpperCase() === spell.word[idx]);
      if (isComplete) {
        document.getElementById('successBanner').classList.remove('hidden');
        document.getElementById('nextBtn').classList.remove('hidden');

        // =========================================================
        // 【核心通訊協定】：向母系統發送獎勵通知
        // =========================================================
        window.parent.postMessage({
          type: "XIAOXUE_DLC_EVENT",
          action: "REWARD",
          payload: {
            exp: spell.exp,
            spiritStones: spell.stones,
            message: `參悟英文真言【${spell.word}】`
          }
        }, "*");
      }
    }

    // Keypad generation
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const keypad = document.getElementById('keypad');
    alphabet.forEach(letter => {
      const btn = document.createElement('button');
      btn.className = 'h-9 rounded-lg bg-slate-800 hover:bg-cyan-700 active:bg-cyan-500 text-xs font-bold font-mono text-slate-200 transition-colors';
      btn.innerText = letter;
      btn.onclick = () => {
        const spell = SPELLS[currentIdx];
        const nextMissing = spell.missing.find(idx => !inputs[idx]);
        if (nextMissing !== undefined) {
          inputs[nextMissing] = letter;
          const slot = document.getElementById(`slot-${nextMissing}`);
          slot.innerText = letter;
          slot.className = 'w-10 h-12 rounded-xl flex items-center justify-center font-bold border-2 bg-cyan-900 border-cyan-400 text-cyan-100';
          checkAnswer();
        }
      };
      keypad.appendChild(btn);
    });

    document.getElementById('nextBtn').onclick = () => {
      currentIdx = (currentIdx + 1) % SPELLS.length;
      renderSpell();
    };

    // Close button sends message to parent Mother system
    document.getElementById('closeBtn').onclick = () => {
      window.parent.postMessage({
        type: "XIAOXUE_DLC_EVENT",
        action: "CLOSE"
      }, "*");
    };

    renderSpell();
  </script>
</body>
</html>
