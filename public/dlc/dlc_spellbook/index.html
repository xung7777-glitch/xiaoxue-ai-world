<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DLC 測試頁面 - 小雪的修仙世界</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #070b14;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(6, 182, 212, 0.4);
      padding: 30px;
      border-radius: 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    h1 {
      color: #fef08a;
      font-size: 22px;
      margin-bottom: 10px;
    }
    p {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #0284c7, #0d9488);
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.5);
      transition: all 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.8);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎮 DLC 測試運行成功</h1>
    <p>您已成功進入此 DLC 測試子資料夾。此處為獨立專案預留空間，點擊下方按鈕即可安全返回主殿。</p>
    <a href="/index.html" class="btn">🏠 返回主殿 / 首頁</a>
  </div>
</body>
</html>
