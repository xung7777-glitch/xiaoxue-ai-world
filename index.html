<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>小雪的修仙世界 - 數位避風港</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- =====================================================================
       全域視窗縮放包覆層（智慧填滿螢幕並水平置中）
       ===================================================================== -->
  <div id="viewport-wrapper">
    <div class="ambient-glow"></div>

    <!-- 直式手機遊戲主畫面容器 (430 x 932 基準) -->
    <main id="game-container">

      <!-- =================================================================
           場景一：洞府主介面 (Scene: Cave Dwelling)
           ================================================================= -->
      <section id="scene-cave" class="scene active">
        
        <!-- 頂部導航列 -->
        <header class="top-navbar">
          <button class="nav-btn" id="btn-menu" title="系統選單" aria-label="系統選單">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          
          <h1 class="nav-title" id="app-title">小雪的修仙世界</h1>
          
          <button class="user-avatar-wrap" id="btn-google-login" type="button" title="Google 帳號登入" aria-label="Google 帳號登入" disabled>
            <img id="user-avatar-img" src="assets/images/google-g.svg" alt="Google 帳號圖示">
          </button>
        </header>

        <!-- 主滑動內容區 (Hero 橫幅與雙欄功能卡片) -->
        <div class="scroll-content">

          <!-- 頂部 Hero 卡片：小雪起居室冥想 -->
          <article class="hero-card" id="hero-card">
            <img class="hero-bg-img" id="hero-bg-img" src="assets/images/hero_meditation.jpg" alt="小雪起居室冥想" onerror="this.style.display='none'; document.getElementById('hero-art-placeholder').style.display='flex';">
            <div class="hero-placeholder-art" id="hero-art-placeholder" style="display: none;">🧘‍♀️</div>
            
            <div class="hero-overlay">
              <div class="hero-title-group">
                <h2 id="hero-title">小雪起居室</h2>
                <p id="hero-subtitle">冥想初始化</p>
              </div>

              <div class="hero-status-pill">
                <span class="pulse-dot"></span>
                <span id="user-realm-text">當前修為：煉氣初期</span>
              </div>
            </div>
          </article>

          <!-- 雙欄功能模組網格（由 main.js 動態渲染自 config.json） -->
          <section class="modules-grid" id="modules-grid" aria-label="功能模組選單">
            <!-- 動態插入模組卡片 -->
          </section>

        </div>
      </section>

      <!-- =================================================================
           場景二：世界大地圖全螢幕視圖 (Scene: World Map)
           ================================================================= -->
      <section id="scene-world-map" class="scene hidden">
        <header class="map-header">
          <button class="back-btn" id="btn-back-cave">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            返回洞府
          </button>
          <div class="hero-status-pill">
            <span class="pulse-dot"></span>
            蠻荒仙府世界圖志
          </div>
        </header>

        <div class="map-canvas-container" id="map-canvas-container">
          <img class="world-map-img" id="world-map-img" src="assets/design/世界地圖.jfif" alt="修仙大地圖" onerror="this.src='assets/design/世界地圖(含小雪所在位置).jfif'">
          
          <!-- 小雪秘境定位錨點（可點擊傳送回洞府） -->
          <div class="map-pin-sanctuary" id="map-pin-sanctuary" style="top: 52%; left: 50%;">
            <div class="pin-ripple">
              <span class="pin-core-icon">🧘‍♀️</span>
            </div>
            <div class="pin-label">小雪修仙秘境（點擊返回）</div>
          </div>
        </div>
      </section>

      <!-- =================================================================
           全域彈窗：修為狀態面板 (Modal: Cultivation Stats)
           ================================================================= -->
      <div class="modal-backdrop" id="modal-stats" role="dialog" aria-modal="true">
        <div class="modal-card">
          <div class="modal-header">
            <h3>修仙者道基狀態</h3>
            <button class="modal-close-btn" id="btn-close-stats" aria-label="關閉">&times;</button>
          </div>
          <div class="modal-body">
            <div class="stat-row">
              <span class="stat-label">當前境界</span>
              <span class="stat-value" id="stat-realm" style="color: var(--accent-cyan);">煉氣初期</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">修為境界進度</span>
              <span class="stat-value" id="stat-exp-text">120 / 300 靈氣</span>
            </div>
            <div class="progress-container">
              <div class="progress-bar" id="stat-exp-bar" style="width: 40%;"></div>
            </div>
            <div style="height: 14px;"></div>
            <div class="stat-row">
              <span class="stat-label">隨身靈石</span>
              <span class="stat-value" id="stat-stones" style="color: var(--accent-gold);">88 顆</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">異獸討伐數</span>
              <span class="stat-value" id="stat-beasts">0 隻</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">英文法咒掌握</span>
              <span class="stat-value" id="stat-words">0 個</span>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Firebase SDK 與母專案共用連線 -->
  <script src="https://www.gstatic.com/firebasejs/12.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-connection.js"></script>

  <!-- 主邏輯程式碼 -->
  <script src="main.js"></script>
</body>
</html>
